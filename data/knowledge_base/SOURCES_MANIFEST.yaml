# Mangrove_AI_Knowledge — source registry
#
# Single source of truth for every document the RAG layer (RAGFlow in
# production, pgvector fallback in the sandbox) is allowed to cite. The
# ingestion pipeline (mangrove_ai.rag.ingest) reads this file, and refuses
# to index anything not listed here with a matching checksum — this is the
# enforcement point for "never invent dataset values / never cite an
# unindexed source."
#
# status values:
#   not_yet_uploaded   — external source we could not fetch from this
#                        sandbox (arXiv/Zenodo/DOI resolvers/Kaggle are
#                        blocked by the sandbox's egress policy); waiting
#                        on the user to upload the file.
#   needs_validation    — user flagged the identifier itself as possibly
#                        wrong; do not ingest or cite until confirmed.
#   ingested            — file present under data/knowledge_base/<category>/
#                        and indexed into the KB.
#
# Every field below is exactly as supplied by the user or the source's own
# public identifier (DOI/arXiv ID/URL). Nothing here is inferred content —
# only the paper/dataset's existence and bibliographic pointer.

